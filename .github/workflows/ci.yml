name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  sender-app:
    name: Sender-App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sender-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-kiosk:
    name: Kiosk-App (Kotlin unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kiosk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew
      - run: ./gradlew test
        # Note: only JVM unit tests (app/src/test) run here. Device-Owner /
        # Lock Task behavior cannot be meaningfully tested on a hosted CI
        # runner (no real hardware, no Knox/OEM quirks) -- that stays a
        # manual real-device verification step per the project plan.

  supabase-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check **/*.ts
      - run: deno test --allow-net --allow-env
